<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Carton & Pallet Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Global namespace -->
  <script>
    window.CartonApp = {};
    window.CartonApp._buildVersion = Date.now();
  </script>

  <!-- Core JS (no JSX → no Babel) -->
  <script>
    // Cache-busting: append build version to local script URLs
    const v = window.CartonApp._buildVersion;
    const scripts = [
      { src: "./js/constants.js" },
      { src: "./js/utils.js" },
      { src: "./js/algorithms.js" },
      { src: "./js/three-utils.js" },
      { src: "./js/components/UIComponents.js" },
      { src: "./js/components/LayerGrid2D.js" },
      { src: "./js/components/PalletView3D.js" },
      { src: "./js/components/ReportProblem.js" },
    ];
    scripts.forEach(s => {
      document.write(`<script src="${s.src}?v=${v}"><\/script>`);
    });
  </script>

  <!-- Main app (may contain JSX or Babel-transformed logic) -->
  <script>
    document.write(`<script type="text/babel" src="./js/app.js?v=${window.CartonApp._buildVersion}"><\/script>`);
  </script>
</body>
</html>
